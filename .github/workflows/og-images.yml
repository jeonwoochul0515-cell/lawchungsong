# 새 칼럼·판례가 올라왔는데 OG 이미지가 없으면 CI에서 자동 생성해 커밋한다 (주간 자동 발행 루틴 보조)
name: Generate OG Images

on:
  push:
    branches: [main]
    paths:
      - 'columns/**.html'
      - 'precedents/**.html'
      - 'columns/index.json'
      - 'precedents/index.json'
  workflow_dispatch:

permissions:
  contents: write

# 두 실행이 같은 이미지를 동시에 만들어 서로 밀어내지 않게 한 번에 하나씩 돈다
concurrency:
  group: og-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # 이벤트 시점이 아니라 지금의 main을 받아야 앞 실행이 만든 이미지를 다시 만들지 않는다
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 누락 OG 확인
        id: check
        run: node scripts/generate-og.mjs --check

      - name: puppeteer 설치 (CI 전용, 프로젝트 의존성 아님)
        if: steps.check.outputs.count != '0'
        run: npm install --no-save puppeteer

      - name: OG 이미지 생성
        if: steps.check.outputs.count != '0'
        run: node scripts/generate-og.mjs

      # 같은 시각에 다인 목록 갱신·발행 루틴도 main에 올리므로, 거절되면 최신을 받아 다시 올린다
      # (2026-09-17 이후 이 단계가 "fetch first"로 매번 실패해 새 글 이미지가 하나도 안 올라갔다)
      - name: 생성된 이미지 커밋
        if: steps.check.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/og/*.jpg
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
            exit 0
          fi
          git commit -m "chore: 신규 칼럼·판례 OG 이미지 자동 생성"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push 재시도 $i"
            sleep $((i * 10))
          done
          exit 1
