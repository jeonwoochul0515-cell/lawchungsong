# 칼럼·판례가 새로 올라오면 다인(상담 챗봇)이 안내할 목록을 자동으로 갱신한다.
# 이게 없으면 주간 자동 발행된 글을 다인이 모른 채로 남는다.
name: Dain Knowledge

on:
  push:
    branches: [main]
    paths:
      - 'columns/**.html'
      - 'precedents/**.html'
      - 'practice/**.html'
  workflow_dispatch:

permissions:
  contents: write

# 한 번에 하나만 — 연달아 push되면 앞 실행이 끝난 뒤 다음이 돈다(같은 파일을 동시에 고치지 않게)
concurrency:
  group: dain-knowledge
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 앞 실행이 올린 _knowledge.json 위에서 다시 만들도록 늘 최신 main을 받는다(옛 커밋에서 만들면 rebase가 충돌한다)
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 새 글 상담 상자에 업무 페이지 버튼을 달고, 업무 페이지 "이 분야의 법률 칼럼"을 최신 6편으로 갱신한다
      - name: 업무 페이지 연결
        run: node scripts/link-practice.mjs

      - name: 지식 목록 생성
        run: node scripts/build-dain-knowledge.mjs

      # 같은 시각에 대표 이미지 생성·발행 루틴도 main에 올리므로, 거절되면 최신을 받아 다시 올린다
      # (og-images.yml과 같은 방식. 2026-09-17 이후 이미지 쪽이 "fetch first"로 실패하던 것과 같은 위험)
      - name: 변경분 커밋
        run: |
          if [ -z "$(git status --porcelain api/_knowledge.json columns precedents practice)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_knowledge.json columns precedents practice
          git commit -m "chore(다인): 칼럼·판례 목록·업무 페이지 연결 자동 갱신"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push 재시도 $i"
            sleep $((i * 10))
          done
          exit 1
